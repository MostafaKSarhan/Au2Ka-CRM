# نطاق مستقل للـ API — اختياري.
#
# الإعداد الافتراضي لا يحتاجه: الواجهة تنادي نفس عنوانها، والبلوكان /api/
# و /uploads/ في au2ka.fasla.cloud.conf يكفيان. هذا الملف لمن يريد الـ API
# على نطاق فرعي خاص به، وحينها تُبنى الواجهة بـ:
#
#   VITE_API_ORIGIN=https://au2ka-api.fasla.cloud npm run build
#
# ويُضبط في بيئة الباكند:
#
#   CORS_ORIGINS=https://au2ka.fasla.cloud

server {
    listen 80;
    listen [::]:80;
    server_name au2ka-api.fasla.cloud;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5123;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
