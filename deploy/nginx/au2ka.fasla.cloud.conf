# Au2Ka CRM — موقع واحد يقدّم الواجهة ويمرّر الـ API وملفات الرفع للباكند.
#
# الواجهة تنادي نفس العنوان الذي قُدِّمت منه (راجع frontend/src/lib/apiOrigin.ts)،
# فبلوكا /api/ و /uploads/ تحتهما هما ما يصل الواجهة بالباكند. وبهذا تعمل نفس
# ملفات البناء على خادمنا وعلى خادم العميل بلا إعادة بناء — يتغيّر اسم النطاق
# في هذا الملف وحده.
#
# التركيب:
#   sudo cp deploy/nginx/au2ka.fasla.cloud.conf /etc/nginx/sites-available/au2ka
#   sudo ln -s /etc/nginx/sites-available/au2ka /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d au2ka.fasla.cloud      # يكتب بلوك 443 والشهادة
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name au2ka.fasla.cloud;

    # certbot يضيف إعادة التوجيه لـ HTTPS هنا. وقبل إصدار الشهادة يخدم
    # هذا البلوك الموقع مباشرة على HTTP.
    root /var/www/faslatech/Au2Ka-CRM/frontend/dist;
    index index.html;

    # صور السيارات وفيديوهاتها حتى 10 ميجابايت في الباكند، وحد nginx
    # الافتراضي ميجابايت واحد يرفض الصور الحقيقية بصمت.
    client_max_body_size 20m;

    # ملفات البناء تحمل بصمة في أسمائها، فتخزينها طويلًا آمن.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # عامل الخدمة وملف البيان لا يُخزَّنان إطلاقًا: لو خُزِّن عامل الخدمة بقي
    # المستخدمون على نسخة قديمة من التطبيق ولم تصلهم أي تحديثات.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # تطبيق صفحة واحدة: أي مسار غير موجود يعود إلى index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5123;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # تنزيل النسخة الاحتياطية يأخذ وقتًا على قاعدة كبيرة.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # الصور والمستندات المرفوعة يقدّمها الباكند من /uploads/.
    # بدون هذا البلوك تظهر الصور 404 على الموقع المنشور.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
