<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Au2Ka">
  <!-- Au2Ka app icon: the workshop's shield mark in the brand navy and crimson. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#080d1a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- A soft crimson glow, matching the app's own background treatment -->
  <circle cx="150" cy="130" r="170" fill="#dc2626" opacity="0.10"/>
  <circle cx="380" cy="400" r="150" fill="#0f2c59" opacity="0.35"/>

  <!-- Shield -->
  <path d="M256 92 L392 146 V266 C392 344 332 400 256 424 C180 400 120 344 120 266 V146 Z"
        fill="url(#shield)"/>
  <path d="M256 128 L360 169 V266 C360 328 313 373 256 394 C199 373 152 328 152 266 V169 Z"
        fill="#080d1a"/>

  <!-- The "2" of Au2Ka, the one glyph that reads at any size -->
  <text x="256" y="322" text-anchor="middle"
        font-family="Cairo, 'Segoe UI', system-ui, sans-serif"
        font-size="196" font-weight="900" fill="#ffffff">2</text>
</svg>
